<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Data Hub</title>
    <style>
      :root {
        color: #17202a;
        background: #f6f7f9;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
      }

      button,
      select,
      input {
        font: inherit;
      }

      .app-shell {
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(240px, 280px) 1fr;
      }

      .sidebar {
        background: #111827;
        color: #f9fafb;
        padding: 28px 22px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 1.1rem;
        font-weight: 760;
      }

      .brand-mark {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        background: #10b981;
        color: #052e24;
        font-weight: 800;
      }

      .sidebar label,
      .toolbar label {
        display: grid;
        gap: 8px;
        margin-top: 22px;
        color: #d1d5db;
        font-size: 0.85rem;
      }

      .sidebar select,
      .toolbar input,
      .toolbar select {
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 10px 11px;
        color: #111827;
        background: #ffffff;
      }

      .toolbar select {
        min-height: 92px;
      }

      .button {
        border: 1px solid #0f766e;
        border-radius: 8px;
        padding: 10px 14px;
        color: #ecfdf5;
        background: #0f766e;
        cursor: pointer;
      }

      .button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .content {
        padding: 30px clamp(18px, 4vw, 48px);
      }

      .topbar,
      .toolbar,
      .metrics,
      .panel {
        max-width: 1180px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        align-items: flex-start;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.7rem, 3vw, 2.55rem);
        line-height: 1.08;
      }

      .muted {
        color: #667085;
      }

      .toolbar {
        margin: 26px 0 18px;
        display: grid;
        grid-template-columns: 220px 1fr auto auto;
        gap: 16px;
        align-items: end;
      }

      .filters {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
      }

      .filters label {
        color: #475467;
        margin-top: 0;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
        margin-bottom: 18px;
      }

      .metric,
      .panel {
        border: 1px solid #e4e7ec;
        border-radius: 8px;
        background: #ffffff;
      }

      .metric {
        padding: 16px;
      }

      .metric strong {
        display: block;
        margin-top: 6px;
        font-size: 1.45rem;
      }

      .panel {
        padding: 18px;
      }

      .panel-header {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        align-items: center;
        margin-bottom: 12px;
      }

      .chart-frame svg {
        display: block;
        width: 100%;
        min-height: 340px;
      }

      .chart-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 16px;
        margin-top: 12px;
        color: #475467;
        font-size: 0.86rem;
      }

      .legend-item {
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }

      .legend-swatch {
        width: 10px;
        height: 10px;
        border-radius: 999px;
      }

      .empty-state {
        padding: 22px;
        border: 1px dashed #d0d5dd;
        border-radius: 8px;
        color: #667085;
        background: #fcfcfd;
      }

      .status,
      .error {
        max-width: 720px;
        padding: 14px 16px;
        border-radius: 8px;
        background: #ffffff;
        border: 1px solid #e4e7ec;
      }

      .error {
        color: #991b1b;
        border-color: #fecaca;
        background: #fff7f7;
      }

      @media (max-width: 820px) {
        .app-shell {
          grid-template-columns: 1fr;
        }

        .metrics,
        .toolbar {
          grid-template-columns: 1fr;
          align-items: stretch;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
