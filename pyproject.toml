[project]
name = "open-data-hub"
version = "0.1.0"
description = "Multi-country public-data API and React dashboards. Starts with Spain (INE) — criminality."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "tenacity>=9.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
    "pandas-stubs",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["open_data_hub"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = []
mypy_path = "backend/src"
packages = ["open_data_hub"]

[tool.pytest.ini_options]
pythonpath = ["backend/src"]
testpaths = ["tests"]
addopts = "-ra --cov=open_data_hub --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["backend/src/open_data_hub"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "pass",
]
show_missing = true
skip_empty = true
